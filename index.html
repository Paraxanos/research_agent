<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Agent Dashboard</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #09101d;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      (async function loadResearchAgent() {
        try {
          let response = null;
          for (const bundleUrl of ["./research_agent.jsx", "/research_agent.jsx"]) {
            response = await fetch(bundleUrl, { cache: "no-store" });
            if (response.ok) break;
          }
          if (!response || !response.ok) {
            throw new Error(`Could not load research_agent.jsx (${response ? response.status : "no response"})`);
          }
          const source = await response.text();
          const transformed = Babel.transform(source, {
            filename: "research_agent.jsx",
            presets: [["react", { runtime: "classic" }]],
          }).code;
          const script = document.createElement("script");
          script.text = `${transformed}\n//# sourceURL=research_agent.jsx`;
          document.body.appendChild(script);
        } catch (error) {
          console.error("Failed to start Research Agent", error);
        }
      })();
    </script>
  </body>
</html>
